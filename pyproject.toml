[project]
name = "labs"
version = "0.1.0"
description = "Stream analyzer"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
